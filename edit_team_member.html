{% extends "base.html" %}

{% block title %}Edit Team Member - NCP Portal[cite: 7]{% endblock %}

{% block header_title %}Edit Team Member[cite: 7]{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white p-4 border-bottom">
                <h4 class="fw-bold mb-0 text-secondary fs-5">Edit Team Member</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Member Name</label>
                        <input type="text" name="name" class="form-control rounded-pill px-3 py-2" value="{{ member.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Designation</label>
                        <input type="text" name="designation" class="form-control rounded-pill px-3 py-2" value="{{ member.designation }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Select Department</label>
                        <select name="department_id" class="form-select rounded-pill px-3 py-2" required>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if dept.id == member.department_id %}selected{% endif %}>
                                    {{ dept.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between align-items-center gap-3">
                        <a href="{{ url_for('team_members_page') }}" class="btn btn-outline-secondary w-50 py-2 rounded-pill fw-medium">Cancel</a>
                        <button type="submit" class="btn btn-dark w-50 py-2 rounded-pill fw-semibold">Update Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
