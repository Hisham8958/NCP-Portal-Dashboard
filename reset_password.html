<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NCP Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Sora for display, Inter for body) -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --body-bg: #f4f5f8;
            --ink: #0f172a;
            --primary-accent: #0f766e;
            --primary-accent-bright: #14b8a6;
            --card-border: rgba(15, 23, 42, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--body-bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(20, 184, 166, 0.08) 0%, rgba(244, 245, 248, 0) 50%);
            color: var(--ink);
            letter-spacing: -0.01em;
            min-height: 100vh;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Sora', 'Inter', sans-serif;
        }
        .card {
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07), 0 10px 15px -5px rgba(15, 23, 42, 0.04) !important;
        }
        .brand-badge {
            background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%);
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
            display: inline-block;
        }
        .form-control {
            border: 1px solid #cbd5e1;
            padding: 11px 16px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--primary-accent-bright);
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
        }
        .btn-custom-dark {
            background-color: #0f172a;
            color: #fff;
            transition: all 0.2s ease;
        }
        .btn-custom-dark:hover {
            background-color: #1e293b;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(15, 23, 42, 0.15);
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 p-3">

    <div class="card p-4 p-md-5" style="width: 440px; max-width: 100%;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="brand-badge">NCP Portal</span>
            </div>
            <h3 class="fw-bold text-dark fs-4 mb-1">Set New Password</h3>
            <p class="text-muted small">Please enter your new password below.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm small py-2 mb-3 rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">New Password</label>
                <input type="password" class="form-control rounded-pill px-3" name="password" required placeholder="••••••••">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">Confirm Password</label>
                <input type="password" class="form-control rounded-pill px-3" name="confirm_password" required placeholder="••••••••">
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom-dark fw-semibold py-2.5 rounded-pill shadow-sm">Update Password</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
