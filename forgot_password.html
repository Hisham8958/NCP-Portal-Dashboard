<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NCP Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 p-md-5" style="width: 420px;">
        <div class="text-center mb-4">
            <span class="text-white px-2 py-1 rounded-2 fs-6 fw-semibold d-inline-block mb-3 shadow-sm" style="background-color: #6366f1;">NCP Portal</span>
            <h3 class="fw-bold text-dark fs-4">Forgot Password</h3>
            <p class="text-muted small">Enter your registered Gmail to receive a password reset link.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm small py-2 mb-3" role="alert">
                {{ error }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Gmail Address</label>
                <input type="email" class="form-control rounded-pill px-3 py-2" name="gmail" required placeholder="Enter your email">
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-dark fw-semibold py-2 rounded-pill shadow-sm">Send Reset Link</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none small fw-semibold" style="color: #6366f1;">Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
